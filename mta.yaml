_schema-version: "3.3.0"
ID: cap-ai-salesorder
description: CAP Sales Order Application
version: 3.0.0

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  - name: cap-ai-salesorder-srv
    type: nodejs
    path: gen/srv

    parameters:
      buildpack: nodejs_buildpack
      instances: 1

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: cap-ai-salesorder-xsuaa
      - name: cap-ai-salesorder-destination
      - name: cap-ai-salesorder-connectivity
      - name: ai-core-test

  - name: salesorderui
    type: html5
    path: app/salesorderui

    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      build-result: dist
      supported-platforms: []

  - name: cap-ai-salesorder-app-content
    type: com.sap.application.content
    path: .

    requires:
      - name: cap-ai-salesorder-repo-host
        parameters:
          content-target: true

    build-parameters:
      build-result: resources

      requires:
        - name: salesorderui
          artifacts:
            - salesorderui.zip
          target-path: resources/

  - name: cap-ai-salesorder-approuter
    type: approuter.nodejs
    path: app/router

    parameters:
      memory: 256M
      disk-quota: 256M
      keep-existing-routes: true

    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

    requires:
      - name: cap-ai-salesorder-xsuaa
      - name: cap-ai-salesorder-destination
      - name: cap-ai-salesorder-repo-runtime
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:

  - name: cap-ai-salesorder-xsuaa
    type: org.cloudfoundry.managed-service

    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
    requires:
      - name: app-api

  - name: cap-ai-salesorder-destination
    type: org.cloudfoundry.managed-service

    parameters:
      service: destination
      service-plan: lite

      config:
        HTML5Runtime_enabled: true

        init_data:
          instance:
            existing_destinations_policy: update

            destinations:

              - Name: ui5
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                URL: https://ui5.sap.com

              - Name: srv-api
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                URL: ~{srv-api/srv-url}

    requires:
      - name: srv-api

  - name: cap-ai-salesorder-connectivity
    type: org.cloudfoundry.managed-service

    parameters:
      service: connectivity
      service-plan: lite

  - name: cap-ai-salesorder-repo-host
    type: org.cloudfoundry.managed-service

    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: cap-ai-salesorder-repo-runtime
    type: org.cloudfoundry.managed-service

    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: ai-core-test
    type: org.cloudfoundry.existing-service